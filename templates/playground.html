<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOVA — Playground</title>
  <link rel="stylesheet" href="/static/css/playground.css">
</head>
<body>
  <main class="pg-app">
    <section class="pg-grid">

      <!-- Card 1 · Live Gesture Input -->
      <article class="pg-card" id="pgInputCard">
        <header class="pg-card-head">
          <div>
            <h2 class="pg-head-title">
              <span class="pg-head-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 20 6v5c0 5-3.4 8.8-8 10.5C7.4 19.8 4 16 4 11V6l8-3.5z"/><path d="m9 11.5 2.2 2.2L15.5 9.3"/></svg>
              </span>
              Live Gesture Input
            </h2>
            <p class="pg-head-sub">Detect and recognize hand gestures</p>
          </div>
          <div class="pg-cam-wrap">
            <button id="pgCamToggle" class="pg-cam-toggle is-off" type="button" aria-haspopup="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6.5" width="13" height="11" rx="2.5"/><path d="m15.5 10.5 6-3v9l-6-3"/></svg>
              <span id="pgCamLabel">Start Camera</span>
              <svg id="pgCamChev" class="pg-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9.5 6 6 6-6"/></svg>
            </button>
            <div id="pgCamMenu" class="pg-cam-menu" hidden></div>
          </div>
        </header>

        <div id="pgStage" class="pg-stage">
          <video id="pgVideo" autoplay muted playsinline></video>
          <canvas id="pgOverlay" class="pg-overlay" aria-label="Hand landmarks overlay"></canvas>
          <div class="pg-stage-badges">
            <span id="pgLiveBadge" class="pg-badge pg-badge-live"><span class="pg-dot"></span>LIVE</span>
            <span id="pgFpsBadge" class="pg-badge">0.0 FPS</span>
          </div>
          <button id="pgExpand" class="pg-expand" type="button" title="Toggle fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
          <p id="pgEmpty" class="pg-empty">Camera is off — tap <strong>Start&nbsp;Camera</strong> to wake it up.</p>
        </div>

        <div class="pg-pred-head">
          <h3>Top 5 Predictions</h3>
          <span id="pgHandPill" class="pg-handpill">no hands</span>
        </div>

        <ol id="pgTop5" class="pg-top5" aria-label="Top 5 gesture predictions"></ol>
      </article>

      <!-- Cards 2–5 · placeholders for the remaining pipeline stages -->
      <article class="pg-card pg-card--ghost">
        <span class="pg-ghost-num">02</span>
        <span class="pg-ghost-title">Frame Analysis</span>
        <span class="pg-ghost-note">coming soon</span>
      </article>

      <article class="pg-card pg-card--ghost">
        <span class="pg-ghost-num">03</span>
        <span class="pg-ghost-title">Active Gesture Buffer</span>
        <span class="pg-ghost-note">coming soon</span>
      </article>

      <article class="pg-card pg-card--ghost">
        <span class="pg-ghost-num">04</span>
        <span class="pg-ghost-title">Sentence Queue & AI</span>
        <span class="pg-ghost-note">coming soon</span>
      </article>

      <article class="pg-card pg-card--ghost">
        <span class="pg-ghost-num">05</span>
        <span class="pg-ghost-title">Speech Output</span>
        <span class="pg-ghost-note">coming soon</span>
      </article>

    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    const HAND_LINKS = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [5, 9], [9, 10], [10, 11], [11, 12],
      [9, 13], [13, 14], [14, 15], [15, 16],
      [13, 17], [17, 18], [18, 19], [19, 20],
      [0, 17]
    ];
    const FINGERTIPS = [4, 8, 12, 16, 20];

    let stream = null;
    let socket = null;
    let running = false;
    let sending = false;
    let lastSendAt = 0;
    let fpsHistory = [];
    let TARGET_FPS = 6;
    let FRAME_INTERVAL = Math.round(1000 / TARGET_FPS);

    let libraryById = null;          // id -> {name, landmarks, preview_path}
    let libraryPromise = null;       // in-flight fetch (deduped)
    let renderedOrderKey = '';       // cached slot order to avoid flicker

    const video = $('pgVideo');
    const stage = $('pgStage');
    const overlay = $('pgOverlay');
    const overlayCtx = overlay.getContext('2d');
    const grabCanvas = document.createElement('canvas');
    const grabCtx = grabCanvas.getContext('2d');

    /* --------------------------------------------------------
       Geometry helpers (video uses object-fit: cover)
       -------------------------------------------------------- */
    function getVideoCoverRect(video, boxW, boxH) {
      if (!video.videoWidth || !video.videoHeight) {
        return { x: 0, y: 0, w: boxW, h: boxH };
      }
      const va = video.videoWidth / video.videoHeight;
      const ba = boxW / boxH;
      let w, h;
      if (ba > va) {
        w = boxW;
        h = w / va;
      } else {
        h = boxH;
        w = h * va;
      }
      return { x: (boxW - w) / 2, y: (boxH - h) / 2, w, h };
    }

    function drawOverlay(hands) {
      const rect = overlay.getBoundingClientRect();
      const scale = window.devicePixelRatio || 1;
      overlay.width = Math.max(1, rect.width * scale);
      overlay.height = Math.max(1, rect.height * scale);
      overlayCtx.setTransform(scale, 0, 0, scale, 0, 0);
      overlayCtx.clearRect(0, 0, rect.width, rect.height);

      if (!hands || !hands.length || !video.videoWidth) return;

      const vRect = getVideoCoverRect(video, rect.width, rect.height);
      const point = p => [vRect.x + p[0] * vRect.w, vRect.y + p[1] * vRect.h];

      overlayCtx.lineWidth = 2;
      overlayCtx.strokeStyle = '#38bdf8';
      overlayCtx.fillStyle = '#00e6a8';

      for (const hand of hands) {
        overlayCtx.beginPath();
        for (const [a, b] of HAND_LINKS) {
          const s = point(hand[a]);
          const e = point(hand[b]);
          overlayCtx.moveTo(s[0], s[1]);
          overlayCtx.lineTo(e[0], e[1]);
        }
        overlayCtx.stroke();

        hand.forEach((p, idx) => {
          const [x, y] = point(p);
          overlayCtx.beginPath();
          overlayCtx.arc(x, y, FINGERTIPS.includes(idx) ? 3.6 : 3, 0, Math.PI * 2);
          overlayCtx.fillStyle = FINGERTIPS.includes(idx) ? '#00e6a8' : '#5fd8ff';
          overlayCtx.fill();
        });
      }
    }

    /* --------------------------------------------------------
       Gesture library (lightweight) for skeleton thumbnails
       -------------------------------------------------------- */
    function ensureLibrary() {
      if (!libraryPromise) {
        libraryPromise = fetch('/api/playground/library')
          .then(r => r.json())
          .then(data => {
            libraryById = new Map();
            for (const g of (data.gestures || [])) {
              libraryById.set(g.id, g);
            }
            return libraryById;
          })
          .catch(() => {
            libraryById = new Map();
            return libraryById;
          });
      }
      return libraryPromise;
    }

    function normalizeThumbPoints(points) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      const flat = points.map(p => [Number(p[0]) || 0, Number(p[1]) || 0]);
      for (const [x, y] of flat) {
        minX = Math.min(minX, x); maxX = Math.max(maxX, x);
        minY = Math.min(minY, y); maxY = Math.max(maxY, y);
      }
      const bw = Math.max(maxX - minX, 0.02);
      const bh = Math.max(maxY - minY, 0.02);
      return { flat };
    }

    // points: single hand 21 pts, or two hands 42 pts (left + right concat)
    function drawThumbSkeleton(canvas, points) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!points || !points.length || !Number.isFinite(Number(points[0][0]))) return false;

      const hands = points.length > 21
        ? [points.slice(0, 21), points.slice(21, 42)]
        : [points];
      const flats = hands.map(hand => hand.map(p => [Number(p[0]) || 0, Number(p[1]) || 0]));

      // Shared bbox keeps both hands in their true relative placement
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const flat of flats) {
        for (const [x, y] of flat) {
          minX = Math.min(minX, x); maxX = Math.max(maxX, x);
          minY = Math.min(minY, y); maxY = Math.max(maxY, y);
        }
      }
      const bw = Math.max(maxX - minX, 0.02);
      const bh = Math.max(maxY - minY, 0.02);

      const W = canvas.width, H = canvas.height, pad = 8;
      const s = Math.min((W - pad * 2) / bw, (H - pad * 2) / bh);
      const ox = (W - bw * s) / 2;
      const oy = (H - bh * s) / 2;
      const pt = (flat, i) => [ox + (flat[i][0] - minX) * s, oy + (flat[i][1] - minY) * s];

      for (const flat of flats) {
        ctx.lineWidth = 1.6;
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.9)';
        ctx.beginPath();
        for (const [a, b] of HAND_LINKS) {
          const p1 = pt(flat, a), p2 = pt(flat, b);
          ctx.moveTo(p1[0], p1[1]);
          ctx.lineTo(p2[0], p2[1]);
        }
        ctx.stroke();

        flat.forEach((p, i) => {
          const [x, y] = pt(flat, i);
          ctx.beginPath();
          ctx.arc(x, y, FINGERTIPS.includes(i) ? 2.6 : 2.1, 0, Math.PI * 2);
          ctx.fillStyle = FINGERTIPS.includes(i) ? '#00e6a8' : 'rgba(95, 216, 255, 0.95)';
          ctx.fill();
        });
      }
      return true;
    }

    // points may be [x,y] or [x,y,z]; handles 42-pt two-hand blobs
    function buildThumbPoints(g) {
      let pts = g && g.landmarks;
      if (!Array.isArray(pts) || !pts.length || !Array.isArray(pts[0])) return null;
      return pts.map(p => [Number(p[0]), Number(p[1])]);
    }

    /* --------------------------------------------------------
       Top-5 rows
       -------------------------------------------------------- */
    function createRow(slotIndex) {
      const li = document.createElement('li');
      li.className = 'pg-row is-empty';

      const thumb = document.createElement('div');
      thumb.className = 'pg-thumb';
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const img = document.createElement('img');
      img.alt = '';
      img.hidden = true;
      thumb.append(canvas, img);

      const name = document.createElement('span');
      name.className = 'pg-row-name';
      name.textContent = '—';

      const bar = document.createElement('span');
      bar.className = 'pg-row-bar';
      const fill = document.createElement('span');
      fill.className = 'pg-row-fill';
      bar.append(fill);

      const score = document.createElement('span');
      score.className = 'pg-row-score';
      score.textContent = '';

      li.append(thumb, name, bar, score);
      return li;
    }

    const rows = [];
    const top5 = $('pgTop5');
    for (let i = 0; i < 5; i++) {
      const row = createRow(i);
      top5.append(row);
      rows.push({
        el: row,
        canvas: row.querySelector('canvas'),
        img: row.querySelector('img'),
        name: row.querySelector('.pg-row-name'),
        fill: row.querySelector('.pg-row-fill'),
        score: row.querySelector('.pg-row-score'),
        gestureId: null,
      });
    }

    function renderRowThumb(row) {
      const g = row.gestureId && libraryById ? libraryById.get(row.gestureId) : null;
      const pts = buildThumbPoints(g);
      if (pts && drawThumbSkeleton(row.canvas, pts)) {
        row.canvas.hidden = false;
        row.img.hidden = true;
      } else if (g && g.preview_path) {
        row.img.src = g.preview_path;
        row.img.hidden = false;
        row.canvas.hidden = true;
      } else {
        row.canvas.hidden = false;
        row.img.hidden = true;
        const ctx = row.canvas.getContext('2d');
        ctx.clearRect(0, 0, row.canvas.width, row.canvas.height);
      }
    }

    function renderTop5(scores) {
      ensureLibrary();

      const list = (scores || []).slice(0, 5);
      const orderKey = list.map(s => s.id).join('|');
      const orderChanged = orderKey !== renderedOrderKey;

      list.forEach((s, i) => {
        const row = rows[i];
        if (row.gestureId !== s.id) {
          row.gestureId = s.id;
          row.name.textContent = s.name;
          renderRowThumb(row);
        }
        row.el.classList.remove('is-empty');
        row.el.classList.toggle('is-active', i === 0);
        row.fill.style.width = `${Math.max(0, Math.min(100, s.score))}%`;
        row.score.textContent = (s.score / 100).toFixed(2);
      });

      for (let i = list.length; i < 5; i++) {
        const row = rows[i];
        if (row.gestureId !== null || orderChanged) {
          row.gestureId = null;
          row.name.textContent = '—';
          renderRowThumb(row);
        }
        row.fill.style.width = '0%';
        row.score.textContent = '';
      }

      renderedOrderKey = orderKey;
    }

    /* --------------------------------------------------------
       FPS + misc badges
       -------------------------------------------------------- */
    function recordFps() {
      const now = performance.now();
      fpsHistory.push(now);
      if (fpsHistory.length > 8) fpsHistory.shift();
      if (fpsHistory.length >= 2) {
        const dur = (now - fpsHistory[0]) / 1000;
        if (dur > 0) {
          $('pgFpsBadge').textContent = `${((fpsHistory.length - 1) / dur).toFixed(1)} FPS`;
        }
      }
    }

    function setHandPill(count) {
      const pill = $('pgHandPill');
      pill.textContent = count ? `${count} hand${count === 1 ? '' : 's'}` : 'no hands';
      pill.classList.toggle('is-hands', !!count);
    }

    /* --------------------------------------------------------
       Camera handling + device picker
       -------------------------------------------------------- */
    async function startCamera(deviceId) {
      if (!navigator.mediaDevices?.getUserMedia) {
        alert('Camera access requires HTTPS or localhost.');
        return;
      }
      const constraints = {
        video: deviceId
          ? { deviceId: { exact: deviceId }, width: { ideal: 960 }, height: { ideal: 720 } }
          : { facingMode: 'user', width: { ideal: 960 }, height: { ideal: 720 } },
        audio: false,
      };
      const media = await navigator.mediaDevices.getUserMedia(constraints);
      stopTracksOnly();
      stream = media;
      video.srcObject = stream;
      await video.play();

      stage.classList.add('is-live');
      const toggle = $('pgCamToggle');
      toggle.classList.remove('is-off');
      $('pgCamLabel').textContent = 'Camera On';
      populateDeviceMenu();

      if (!running) {
        running = true;
        connect();
      }
    }

    function stopTracksOnly() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
    }

    function stop() {
      running = false;
      sending = false;
      socket?.close();
      socket = null;
      stopTracksOnly();
      video.srcObject = null;
      camMenu.hidden = true;
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      stage.classList.remove('is-live');
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      const toggle = $('pgCamToggle');
      toggle.classList.add('is-off');
      $('pgCamLabel').textContent = 'Start Camera';
      $('pgFpsBadge').textContent = '0.0 FPS';
      fpsHistory = [];
      setHandPill(0);
    }

    let menuPopulated = false;
    async function populateDeviceMenu() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter(d => d.kind === 'videoinput');
        const menu = $('pgCamMenu');
        const activeId = stream?.getVideoTracks?.()[0]?.getSettings?.().deviceId;
        menu.replaceChildren();
        if (!cams.length) {
          const none = document.createElement('button');
          none.className = 'pg-cam-item';
          none.textContent = 'No camera found';
          none.disabled = true;
          menu.append(none);
        }
        cams.forEach((d, i) => {
          const item = document.createElement('button');
          item.className = 'pg-cam-item';
          item.type = 'button';
          item.textContent = d.label || `Camera ${i + 1}`;
          item.classList.toggle('is-active', d.deviceId === activeId);
          item.onclick = () => {
            menu.hidden = true;
            startCamera(d.deviceId).catch(err => alert(`Could not switch camera: ${err.message}`));
          };
          menu.append(item);
        });
        menuPopulated = true;
      } catch {
        menuPopulated = false;
      }
    }

    const camToggle = $('pgCamToggle');
    const camMenu = $('pgCamMenu');

    camToggle.onclick = e => {
      if (e.target.closest('#pgCamChev')) {
        if (camMenu.hidden) populateDeviceMenu().then(() => { camMenu.hidden = false; });
        else camMenu.hidden = true;
        return;
      }
      if (running) {
        stop();
        camMenu.hidden = true;
        return;
      }
      startCamera().catch(err => {
        stop();
        alert(`Could not open camera: ${err.message}`);
      });
    };

    document.addEventListener('click', e => {
      if (!camMenu.hidden && !camToggle.contains(e.target) && !camMenu.contains(e.target)) {
        camMenu.hidden = true;
      }
    });

    $('pgExpand').onclick = () => {
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      } else {
        stage.requestFullscreen?.().catch(() => {});
      }
    };

    window.addEventListener('beforeunload', stop);

    /* --------------------------------------------------------
       Frame streaming through /ws/pipeline (same as admin)
       -------------------------------------------------------- */
    function sendFrame() {
      if (!running || sending || socket?.readyState !== WebSocket.OPEN || !video.videoWidth) return;

      const va = video.videoWidth / video.videoHeight;
      const w = 480;
      const h = Math.round(480 / va);
      grabCanvas.width = w;
      grabCanvas.height = h;
      grabCtx.drawImage(video, 0, 0, w, h);

      sending = true;
      lastSendAt = performance.now();
      socket.send(JSON.stringify({ image_base64: grabCanvas.toDataURL('image/jpeg', 0.68) }));
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      socket = new WebSocket(`${proto}://${location.host}/ws/pipeline`);

      socket.onopen = () => {
        socket.send(JSON.stringify({ action: 'init' }));
        sendFrame();
      };

      socket.onmessage = event => {
        sending = false;
        recordFps();
        let data;
        try {
          data = JSON.parse(event.data);
        } catch {
          return;
        }
        if (data.error) {
          console.warn('Pipeline error:', data.error);
        } else {
          setHandPill(data.hand_count || 0);
          renderTop5(data.scores || []);
          drawOverlay(data.landmarks || []);
        }
        if (running) {
          const wait = Math.max(10, FRAME_INTERVAL - (performance.now() - lastSendAt));
          setTimeout(sendFrame, wait);
        }
      };

      socket.onerror = () => { sending = false; };

      socket.onclose = () => {
        sending = false;
        if (running) setTimeout(connect, 1000);
      };
    }

    // Preload thumbnails before the first detection arrives
    ensureLibrary();
  </script>
</body>
</html>
